name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Testes (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: '3.13' }
          - { os: windows-latest, python: '3.12' }
    # O Windows nunca foi exercitado antes deste CI: enquanto não estiver verde, falhas dele aparecem no relatório sem bloquear o Linux.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Bibliotecas do Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 fonts-dejavu-core
      - name: Dependências
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Testes automáticos
        shell: bash
        env:
          TEMP: ${{ runner.temp }}      # caminho longo (no Windows o padrão vem como C:\Users\RUNNER~1, que quebra comparações de Path)
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          set +e
          python -I -W ignore -m unittest discover -s tests -v > test.log 2>&1
          status=$?
          echo "---- resumo ----"; tail -n 4 test.log
          echo "---- falhas e erros ----"; grep -E "^(ERROR|FAIL):" test.log || echo "nenhum"
          echo "---- motivos dos testes pulados ----"; grep -o "skipped '.*'" test.log | sort | uniq -c | sort -rn | head -20
          exit $status
      - name: Guardar o log completo dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}
          path: test.log
          if-no-files-found: ignore
      - name: Teste de fumaça do programa
        run: python app.py --smoke-test
      - name: Suíte de qualidade (PDF, rápida)
        run: python tools/quality_suite.py --only pdf --fast --out quality-report
      - name: Guardar o relatório de qualidade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-${{ matrix.os }}
          path: quality-report
          if-no-files-found: ignore
